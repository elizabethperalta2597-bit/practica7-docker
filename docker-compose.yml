services:
  app:
    build:
      context: ./src
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_NAME: hola_mundo
      DB_USER: hola
      DB_PASSWORD: hola123
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: hola_mundo
      MYSQL_USER: hola
      MYSQL_PASSWORD: hola123
      MYSQL_ROOT_PASSWORD: root123
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql_data:
